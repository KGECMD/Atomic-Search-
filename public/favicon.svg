<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a90e2"/>
      <stop offset="50%" stop-color="#7ed957"/>
      <stop offset="100%" stop-color="#4a90e2"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer ring glow -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="url(#g)" stroke-width="0.5" opacity="0.2"/>
  <!-- Three orbits with glow -->
  <g fill="none" stroke="url(#g)" stroke-width="2.2" opacity="0.95" filter="url(#glow)">
    <ellipse cx="32" cy="32" rx="22" ry="8.5" transform="rotate(0 32 32)"/>
    <ellipse cx="32" cy="32" rx="22" ry="8.5" transform="rotate(60 32 32)"/>
    <ellipse cx="32" cy="32" rx="22" ry="8.5" transform="rotate(120 32 32)"/>
  </g>
  <!-- Nucleus with gradient -->
  <circle cx="32" cy="32" r="7" fill="url(#g)" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="4" fill="#ffffff" opacity="0.4"/>
</svg>
